# Ring Link: docker compose up -d --build
name: ringlink

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ringlink-server:latest
    restart: unless-stopped
    environment:
      PORT: "2567"
      DATA_DIR: /data
      MAX_PLAYERS: ${MAX_PLAYERS:-2}
      SNAPSHOT_RATE: ${SNAPSHOT_RATE:-20}
      RECONNECT_SECONDS: ${RECONNECT_SECONDS:-60}
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-0}
      ENABLE_SONIC3_EXPERIMENT: ${ENABLE_SONIC3_EXPERIMENT:-0}
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    expose:
      - "2567"
    stop_grace_period: 15s

  # One-shot: finds every .rsdk in this folder (any file name), identifies it by content and extracts it into ./data.
  #   docker compose run --rm extract
  extract:
    profiles: ["tools"]
    image: node:22-bookworm
    working_dir: /app
    environment:
      RSDK_DIR: /app
    volumes:
      - .:/app
      - extract_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx tsx tools/rsdk-detect.ts /app && npx tsx tools/extract.ts --out data && npx tsx tools/export-rsdkv5.ts"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ringlink-client:latest
    restart: unless-stopped
    environment:
      SERVER_UPSTREAM: server:2567
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  extract_node_modules:
