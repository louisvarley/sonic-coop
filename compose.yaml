# Sonic Coop: docker compose up -d --build
name: ringlink

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ringlink-server:latest
    restart: unless-stopped
    environment:
      PORT: "2567"
      DATA_DIR: /data
      MAX_PLAYERS: ${MAX_PLAYERS:-2}
      SNAPSHOT_RATE: ${SNAPSHOT_RATE:-20}
      RECONNECT_SECONDS: ${RECONNECT_SECONDS:-60}
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-0}
      ENABLE_SONIC3: ${ENABLE_SONIC3:-0}
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    depends_on:
      extract:
        condition: service_completed_successfully
    expose:
      - "2567"
    stop_grace_period: 15s

  # Drop original game files into game-files/, then run docker compose up -d --build.
  # Extraction runs before the server; only originals (read-only) and generated data are mounted.
  extract:
    build:
      context: .
      dockerfile: docker/extract.Dockerfile
    image: ringlink-extract:latest
    working_dir: /app
    environment:
      RSDK_DIR: /app/game-files
    volumes:
      - ./game-files:/app/game-files:ro
      - ${DATA_PATH:-./data}:/app/data
    command: sh docker/extract.sh

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ringlink-client:latest
    restart: unless-stopped
    environment:
      SERVER_UPSTREAM: server:2567
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
