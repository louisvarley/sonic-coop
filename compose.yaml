# Sonic Coop: docker compose up -d --build
name: ringlink

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ringlink-server:latest
    restart: unless-stopped
    environment:
      PORT: "2567"
      DATA_DIR: /data
      MAX_PLAYERS: ${MAX_PLAYERS:-2}
      SNAPSHOT_RATE: ${SNAPSHOT_RATE:-20}
      RECONNECT_SECONDS: ${RECONNECT_SECONDS:-60}
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-0}
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    depends_on:
      extract:
        condition: service_completed_successfully
    expose:
      - "2567"
    stop_grace_period: 15s

  # Runs on every "up": finds the game files in this folder (any name; see README.md), identifies them by content and
  # extracts whatever is missing or out of date into DATA_PATH. Drop your files next to this file and
  # docker compose up -d --build.
  extract:
    build:
      context: docker
      dockerfile: extract.Dockerfile
    image: ringlink-extract:latest
    working_dir: /app
    environment:
      RSDK_DIR: /app
    volumes:
      - .:/app
      - ${DATA_PATH:-./data}:/app/data
      - extract_node_modules:/app/node_modules
    command: sh docker/extract.sh

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ringlink-client:latest
    restart: unless-stopped
    environment:
      SERVER_UPSTREAM: server:2567
    volumes:
      - ${DATA_PATH:-./data}:/data:ro
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  extract_node_modules:
